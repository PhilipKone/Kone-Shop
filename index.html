<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/app-shop.svg" />
    <link rel="apple-touch-icon" href="/app-shop.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kone Shop: The official supply shop for Kone Academy technology and innovation gear." />
    <meta name="author" content="Kone Academy" />
    <link rel="canonical" href="https://shop.koneacademy.io/" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://shop.koneacademy.io/" />
    <meta property="og:title" content="Kone Shop | The Official Supply Shop" />
    <meta property="og:description" content="Kone Shop: The official supply shop for Kone Academy technology and innovation gear." />
    <meta property="og:image" content="https://shop.koneacademy.io/og-image.png" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Kone Shop",
        "url": "https://shop.koneacademy.io/",
        "parentOrganization": {
          "@type": "Organization",
          "name": "Kone Academy",
          "url": "https://www.koneacademy.io/"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "name": "Kone Shop",
        "parentOrganization": {
          "@type": "Organization",
          "name": "Kone Academy",
          "url": "https://www.koneacademy.io/"
        },
        "image": "https://shop.koneacademy.io/app-shop.svg",
        "@id": "https://shop.koneacademy.io/",
        "url": "https://shop.koneacademy.io/",
        "telephone": "+233551993820",
        "priceRange": "$$",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Accra, Ghana",
          "addressLocality": "Accra",
          "addressCountry": "GH"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ItemList",
        "name": "Kone Shop Navigation",
        "itemListElement": [
          {
            "@type": "SiteNavigationElement",
            "position": 1,
            "name": "Product Catalogue",
            "url": "https://shop.koneacademy.io/"
          },
          {
            "@type": "SiteNavigationElement",
            "position": 2,
            "name": "Shopping Cart",
            "url": "https://shop.koneacademy.io/cart"
          },
          {
            "@type": "SiteNavigationElement",
            "position": 3,
            "name": "Secure Checkout",
            "url": "https://shop.koneacademy.io/checkout"
          }
        ]
      }
    </script>
    <title>Kone Shop | The Official Supply Shop</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
