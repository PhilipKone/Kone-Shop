    <!-- WebMCP Declarations for Autonomous Agentic Browsing -->
    <script type="application/webmcp+json">
    {
      "version": "1.0",
      "name": "Kone Shop Supplies & Hardware Portal",
      "description": "Agent tools for browsing official Kone Academy hardware kits, robotics parts, curriculum materials, and placing orders",
      "tools": [
        {
          "name": "search_shop_products",
          "description": "Search hardware supplies, robotics kits, and STEM gear by category or keyword",
          "parameters": {
            "type": "object",
            "properties": {
              "query": { "type": "string" },
              "category": { "type": "string", "enum": ["all", "lab-hardware", "kids-kits", "apparel", "accessories"] }
            }
          }
        },
        {
          "name": "navigate_shop_category",
          "description": "Filter shop catalog to a specific product category",
          "parameters": {
            "type": "object",
            "properties": {
              "category": { "type": "string", "enum": ["all", "lab-hardware", "kids-kits", "apparel", "accessories"] }
            },
            "required": ["category"]
          }
        }
      ]
    }
    </script>
